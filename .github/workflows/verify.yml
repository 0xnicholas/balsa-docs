# CI gates (#18, delivery.md §5). Job A is repo-internal: frontmatter value domain,
# ledger's four gates, generator idempotence, build + route shape, the platform contract
# (#27: `.nvmrc` / `wrangler.jsonc` / `_headers` / the Pagefind index — delivery.md §2) and
# the agent surface (twins, /llms.txt + /llms-manifest.json against the content set, writing
# rules — #26, agent-surface.md §9). Job B checks the pinned ref out (content-boundary.md §4 /
# api-reference.md §5) and diffs verbatim snippets and source pointers against it. Job C
# regenerates the API reference tree from that pinned ref and enforces its three red lines
# plus the freshness yellow (api-reference.md §6). The platform build does not validate;
# these three jobs are the red line.
name: Verify

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-gates:
    name: Repo gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The removal gate compares this version's page set against the previous one.
          fetch-depth: 0

      # Node: the pin lives in `.nvmrc` (delivery.md §2.4) and is read here — one source for
      # CI and the platform build image, so they cannot drift. `--experimental-strip-types` is
      # the flag #17 chose for the whole toolchain.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Resolve the baseline ref (previous version)
        id: baseline
        run: |
          baseline='${{ github.event.pull_request.base.sha || github.event.before }}'
          if [ -z "$baseline" ] || [ "$baseline" = "0000000000000000000000000000000000000000" ]; then
            baseline=$(git rev-parse --verify --quiet HEAD^ || echo HEAD)
          fi
          echo "ref=$baseline" >> "$GITHUB_OUTPUT"

      - name: pnpm verify
        env:
          BASELINE_REF: ${{ steps.baseline.outputs.ref }}
        run: pnpm verify

  pin-gates:
    name: Pinned-ref gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned ref
        id: pin
        run: |
          echo "repo=$(jq -r .repo pinned-ref.json)" >> "$GITHUB_OUTPUT"
          echo "commit=$(jq -r .commit pinned-ref.json)" >> "$GITHUB_OUTPUT"

      # Public repo, so a plain checkout works; `git show <pin>:<path>` in the gates reads
      # exactly this commit, whatever the checkout's own branch would be.
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.pin.outputs.repo }}
          ref: ${{ steps.pin.outputs.commit }}
          path: .framework/balsa-framework

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: pnpm verify:pin
        env:
          BALSA_FRAMEWORK_DIR: ${{ github.workspace }}/.framework/balsa-framework
        run: pnpm verify:pin

  # The generated API reference tree (api-reference.md §2/§4/§6). This job is the only place
  # the pinned framework is *built*: entries consume `dist/*.d.ts` (裁决 5), so the job
  # installs and builds `@balsa/core` inside the checkout at the fixed path the entry shims
  # point at. The three red lines are TypeDoc errors, TypeDoc warnings and a non-empty
  # `git status` after regeneration; the yellow is pin freshness, which never blocks.
  api-tree:
    name: API tree gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the pinned ref
        id: pin
        run: |
          echo "repo=$(jq -r .repo pinned-ref.json)" >> "$GITHUB_OUTPUT"
          echo "commit=$(jq -r .commit pinned-ref.json)" >> "$GITHUB_OUTPUT"

      # Same fixed path as everywhere else (api-reference.md §4 F9): `.framework/balsa-framework`.
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.pin.outputs.repo }}
          ref: ${{ steps.pin.outputs.commit }}
          path: .framework/balsa-framework

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            .framework/balsa-framework/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # 🟡 freshness (api-reference.md §6): `continue-on-error` is what makes this a yellow
      # annotation instead of a failed job — a lagging pin is a prompt, not a blocker.
      - name: Pinned-ref freshness (yellow)
        continue-on-error: true
        run: pnpm run check:pin-freshness

      - name: Regenerate + diff (red ×3)
        run: pnpm verify:api
