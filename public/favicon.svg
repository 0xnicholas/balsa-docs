<!--
  Placeholder favicon (#19, brand-visual.md §3.1): one geometric lowercase "o", no
  invented graphic — the umbrella placeholder the Oribos rename (#48) carries over
  from the marketing site. Transparent background, dual value via prefers-color-scheme —
  light #9e630a (accent), dark #efd29f (accent-high). Replaced by the umbrella-brand
  asset when it lands; shape and glyph stay, only the fill tokens are the placeholders.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Oribos">
	<style>
		text {
			font-family: ui-rounded, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
			font-size: 30px;
			font-weight: 700;
			fill: #9e630a;
		}
		@media (prefers-color-scheme: dark) {
			text {
				fill: #efd29f;
			}
		}
	</style>
	<text x="16" y="24.5" text-anchor="middle">o</text>
</svg>
